services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abiturient-api
    ports:
      - "8080:8080"

  web:
    image: nginx:latest
    container_name: abiturient-web
    ports:
      - "3000:3000"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html

    depends_on:
      - api
